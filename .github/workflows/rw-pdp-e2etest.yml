name: "Reusable workflow: End-to-end test"

on:
  workflow_call:
    inputs:
      target:      { type: string, required: true }
      rel:         { type: string, required: false, default: "" }
      servicePort: { type: string, required: false, default: "8080" }
    secrets:
      kube_cert:      { required: true }
      kube_cluster:   { required: true }
      kube_namespace: { required: true }
      kube_token:     { required: true }
      e2e_auth_token: { required: true }
      e2e_properties: { required: true,
                        description: "Complete E2E properties content for this environment (pass \"\" for preview, which always uses the committed local.properties fixture)" }
  workflow_dispatch:
    inputs:
      target:      { type: choice, required: true, options: [ "uat", "staging", "prod" ], default: "uat",
                     description: "Target environment" }
      rel:         { type: string, required: false, default: "",
                     description: "Optional release name (e.g. 'pr-913', defaults to stable release)" }
      servicePort: { type: number, required: false, default: 8080,
                     description: "Optional service port to forward (e.g. '8080', defaults to 8080)" }

jobs:
  e2etest:
    name: "E2E test in ${{ inputs.target }} of ${{ inputs.rel || 'stable' }}"
    permissions: { contents: read, packages: read }
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    concurrency: e2e-${{ inputs.target }}-${{ inputs.rel || 'stable' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Determine variable values"
        id:   vars
        shell: bash
        env:
          REL: ${{ inputs.rel || 'stable' }}
          SP:  ${{ inputs.servicePort }}
        run: |
          echo "Run e2e tests - rel: [$REL], servicePort: [$SP]"
          # Determine service name
          SVC="pdp-${REL}-provider-data-platform"
          echo "Resolved service name: [$SVC]"
          echo "svc=$SVC" >> "$GITHUB_OUTPUT"

      - name: "Set up Java 25 (Temurin distro)"
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"

      - name: "Set up Gradle (cache)"
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: "Authenticate with Kubernetes cluster"
        id:   kube_auth
        uses: ./.github/actions/cp-kube-auth
        with:
          kube_cert:      ${{ secrets.kube_cert }}
          kube_cluster:   ${{ secrets.kube_cluster }}
          kube_namespace: ${{ secrets.kube_namespace }}
          kube_token:     ${{ secrets.kube_token }}

      - name: "Display Kubernetes context (diagnostic-only)"
        if:   steps.kube_auth.outputs.kube_auth_attempted == 'true'
        run: |
          kubectl config current-context
          kubectl -n "${{ secrets.kube_namespace }}" get svc "${{ steps.vars.outputs.svc }}" -o wide || true

      - name: "Wait for rollout" # Because this tends to be run just after a deployment
        if:   steps.kube_auth.outputs.kube_auth_attempted == 'true'
        run: |
          kubectl -n "${{ secrets.kube_namespace }}" rollout status deploy/"${{ steps.vars.outputs.svc }}" --timeout=180s

      - name: "Port-forward service -> localhost:18080"
        if:   steps.kube_auth.outputs.kube_auth_attempted == 'true'
        env:
          NS:  ${{ secrets.kube_namespace }}
          SP:  ${{ inputs.servicePort }}
          SVC: ${{ steps.vars.outputs.svc }}
        run: |
          echo "Port-forwarding svc/${SVC} on ${SP} → localhost:18080 in namespace=${NS}"
          kubectl -n "${NS}" port-forward "svc/${SVC}" 18080:"${SP}" &
          echo $! > /tmp/pf.pid
          sleep 3

      - name: "Run E2E tests"
        if:   steps.kube_auth.outputs.kube_auth_attempted == 'true'
        env:
          E2E_AUTHTOKEN:  ${{ secrets.e2e_auth_token }}
          E2E_PROPERTIES: ${{ secrets.e2e_properties }}
          GITHUB_TOKEN:   ${{ github.token }}
          GITHUB_ACTOR:   ${{ github.actor }}
        run: |
          ./gradlew :provider-data-e2e:e2eTest \
            -De2e.baseUri="http://127.0.0.1:18080" \
            --stacktrace

      - name: "Upload E2E reports"
        if:   always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ inputs.target }}-${{ inputs.rel || 'stable' }}-reports
          path: |
            provider-data-e2e/build/reports/**
            provider-data-e2e/build/test-results/**
          if-no-files-found: ignore

      - name: "Cleanup port-forward"
        if:   always()
        run: |
          test -f /tmp/pf.pid && kill "$(cat /tmp/pf.pid)" 2>/dev/null || true
          echo "==== Port-forward processes ===="
          pgrep -af 'kubectl.*port-forward' || true
