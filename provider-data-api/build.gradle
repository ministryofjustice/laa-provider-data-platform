
plugins {
    id 'java-library'
    id 'org.openapi.generator'
    id 'uk.gov.laa.springboot.laa-spring-boot-gradle-plugin'
}

dependencies {
    compileOnly "com.fasterxml.jackson.core:jackson-annotations"
    compileOnly "io.swagger.core.v3:swagger-annotations:2.2.54"
    compileOnly "jakarta.annotation:jakarta.annotation-api"
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'jakarta.validation:jakarta.validation-api'
    compileOnly "org.springframework:spring-context"
    compileOnly "org.springframework:spring-web"
}

publishing {
    publications {
        gpr(MavenPublication) {
            from components.java
            artifactId = 'provider-data-api'
        }
    }
}

def generatedDir = layout.buildDirectory.dir("generated/openapi")
def generatedJavaDir = generatedDir.map { it.dir("src/main/java") }
def generatedJavaPath = generatedJavaDir.map { it.asFile.toPath() }

sourceSets.main.java.srcDir(generatedJavaDir)

tasks.named('checkstyleMain', Checkstyle) {
    exclude { details -> details.file.toPath().startsWith(generatedJavaPath.get()) }
}

openApiGenerate {
    generatorName = "spring"
    inputSpec = layout.projectDirectory.file("bundled-openapi-spec.yaml").asFile.path
    outputDir = generatedDir.get().asFile.path
    // Do not generate supporting files — this is a contract-only module; implementation
    // configuration belongs in the service. EnumConverterConfiguration in particular ends up in
    // org.openapitools.configuration which is outside the application component scan.
    openapiGeneratorIgnoreList = ["**/EnumConverterConfiguration.java", "**/ApiUtil.java"]

    // Keep provider-data-api package naming
    apiPackage     = "uk.gov.justice.laa.providerdata.api"
    invokerPackage = "uk.gov.justice.laa.providerdata.invoker"
    modelPackage   = "uk.gov.justice.laa.providerdata.model"

    configOptions = [
            generateBuilders     : "true",
            interfaceOnly        : "true", // interfaces only
            serializableModel    : "true",
            skipDefaultInterface : "true",
            useJakartaEe         : "true",
            useSpringBoot3       : "true",
            openApiNullable      : "false",
            useTags              : "true",
            hideGenerationTimestamp: "true",
    ]
}

tasks.named('compileJava') {
    dependsOn tasks.named('openApiGenerate')
    options.compilerArgs.addAll(['-Xlint:-deprecation', '-Xlint:-removal'])
}

processResources {
    from(layout.projectDirectory.file("bundled-openapi-spec.yaml"))
    // Publish the un-bundled source fragments too, so consumers/tools that want to inspect the
    // OpenAPI spec by concept (rather than the single bundled file) can do so.
    from(layout.projectDirectory.dir("openapi")) {
        into("openapi")
    }
}

// Bundles the split OpenAPI source files under openapi/ into the single committed
// bundled-openapi-spec.yaml consumed by openApiGenerate, e2e response validation, and tech-docs.
// Requires npx (Node) — only needed by developers editing openapi/ fragments, and by CI's
// checkOpenApiBundleUpToDate task below. Not part of the default build/check lifecycle.
def bundledSpecFile = layout.projectDirectory.file("bundled-openapi-spec.yaml")
def openApiSourceDir = layout.projectDirectory.dir("openapi")

tasks.register('bundleOpenApi', Exec) {
    description = "Bundle the split OpenAPI spec (openapi/) into bundled-openapi-spec.yaml"
    group = "openapi"
    inputs.dir(openApiSourceDir)
    outputs.file(bundledSpecFile)
    commandLine "npx", "--yes", "@redocly/cli", "bundle",
            openApiSourceDir.file("index.yaml").asFile.path,
            "-o", bundledSpecFile.asFile.path,
            "--ext", "yaml"
}

tasks.register('checkOpenApiBundleUpToDate') {
    description = "Fail if bundled-openapi-spec.yaml is out of date with the openapi/ source files"
    group = "openapi"
    def checkOutputFile = layout.buildDirectory.file("openapi-check/bundled-openapi-spec.yaml")
    def execOps = providers.exec {
        commandLine "npx", "--yes", "@redocly/cli", "bundle",
                openApiSourceDir.file("index.yaml").asFile.path,
                "-o", checkOutputFile.get().asFile.path,
                "--ext", "yaml"
    }
    inputs.dir(openApiSourceDir)
    inputs.file(bundledSpecFile)
    outputs.file(checkOutputFile)
    doLast {
        checkOutputFile.get().asFile.parentFile.mkdirs()
        execOps.result.get() // triggers the exec and fails the build if it errors
        if (checkOutputFile.get().asFile.text != bundledSpecFile.asFile.text) {
            throw new GradleException(
                    "provider-data-api/bundled-openapi-spec.yaml is out of date with openapi/. " +
                    "Run './gradlew :provider-data-api:bundleOpenApi' and commit the result.")
        }
    }
}

// All Java is generated by openApiGenerate; JaCoCo coverage is not meaningful.
tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { enabled = false }
tasks.withType(org.gradle.testing.jacoco.tasks.JacocoCoverageVerification).configureEach { enabled = false }

plugins.withId('org.springframework.boot') {
    tasks.named('bootJar')        { enabled = false }
    tasks.named('bootRun')        { enabled = false }
    tasks.named('bootBuildImage') { enabled = false }
    tasks.named('jar')            { enabled = true }
}
