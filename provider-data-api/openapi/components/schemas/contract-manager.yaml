ContractManagerProviderPatchV2:
  oneOf:
  - $ref: "#/ContractManagerLinkByGUIDV2"
  - $ref: "#/ContractManagerLinkDefaultV2"
  - $ref: "#/ContractManagerLinkHeadOfficeV2"
  description: |
    Exactly one of `contractManagerGUID`, `useDefaultContractManager` or
    `useHeadOfficeContractManager` must be provided. `useHeadOfficeContractManager` assigns
    whichever contract manager is currently linked to the provider's head office and is
    applicable for LSP child offices only.

ContractManagerLinkByGUIDV2:
  type: object
  required:
  - contractManagerGUID
  properties:
    contractManagerGUID:
      $ref: "./common.yaml#/BaseEntityGUIDV2"
  description: |
    Links an existing contract manager to an office by GUID.

ContractManagerLinkDefaultV2:
  type: object
  required:
  - useDefaultContractManager
  properties:
    useDefaultContractManager:
      type: boolean
      description: |
        Setting this flag to true assigns the system default contract manager.
  description: |
    Indicates that the system default contract manager should be assigned.

ContractManagerLinkHeadOfficeV2:
  type: object
  required:
  - useHeadOfficeContractManager
  properties:
    useHeadOfficeContractManager:
      type: boolean
      description: |
        Setting this flag to true interlinks the contract manager record from the head office
  description: |
    Applicable only for LSP Child Offices. Indicates that the new contract manager assignment
    should be to the contract manager that is currently specified at the head office (Firm
    Contract Manager trickle-down). This update only links the data (no duplicate is created).
    Rejected if the head office has no contract manager assigned.

HeadOfficeContractManagerLinkV2:
  oneOf:
  - $ref: "#/ContractManagerLinkByGUIDV2"
  - $ref: "#/ContractManagerLinkDefaultV2"
  description: |
    Exactly one of `contractManagerGUID` or `useDefaultContractManager` must be provided when
    creating an LSP or Chambers head office. `useHeadOfficeContractManager` is not applicable
    here since this office is itself the head office.

ContractManagerContractManagerIdV2:
  type: string
  example: "*TODO: Provide example*"
  description: |
    CWA ref: PER_ALL_PEOPLE_F.PERSON_ID (for provider firms' offices ID is stored in
    PO_VENDOR_SITES_ALL.ATTRIBUTE4)

ContractManagerFirstNameV2:
  type: string
  example: "John"
  description: |
    CWA ref: PER_ALL_PEOPLE_F.FIRST_NAME

ContractManagerLastNameV2:
  type: string
  example: "Smith"
  description: |
    CWA ref: PER_ALL_PEOPLE_F.LAST_NAME

ContractManagerEmailAddressV2:
  type: string
  format: email
  description: |
    CWA ref: PER_ALL_PEOPLE_F.EMAIL_ADDRESS
  example: "john.smith@example.com"

ContractManagerV2:
  allOf:
  - $ref: "./common.yaml#/BaseEntityV2"
  - type: object
    required:
    - contractManagerId
    - firstName
    - lastName
    properties:
      contractManagerId:
        $ref: "#/ContractManagerContractManagerIdV2"
      firstName:
        $ref: "#/ContractManagerFirstNameV2"
      lastName:
        $ref: "#/ContractManagerLastNameV2"
      email:
        $ref: "#/ContractManagerEmailAddressV2"

OfficeContractManagerV2:
  allOf:
  - $ref: "./common.yaml#/BaseEntityV2"
  - type: object
    required:
    - contractManagerId
    - firstName
    - lastName
    properties:
      contractManagerId:
        $ref: "#/ContractManagerContractManagerIdV2"
      firstName:
        $ref: "#/ContractManagerFirstNameV2"
      lastName:
        $ref: "#/ContractManagerLastNameV2"
      email:
        $ref: "#/ContractManagerEmailAddressV2"
