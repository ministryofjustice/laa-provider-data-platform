LiaisonManagerFirstNameV2:
  type: string
  description: |
    CWA ref: PO_VENDOR_CONTACTS.FIRST_NAME
  example: "John"

LiaisonManagerLastNameV2:
  type: string
  description: |
    CWA ref: PO_VENDOR_CONTACTS.LAST_NAME
  example: "Smith"

LiaisonManagerEmailAddressV2:
  type: string
  format: email
  description: |
    CWA ref: PO_VENDOR_CONTACTS.EMAIL_ADDRESS
  example: "john.smith@example.com"

LiaisonManagerPhoneV2:
  type: string
  description: |
    CWA ref: PO_VENDOR_CONTACTS.AREA_CODE + PO_VENDOR_CONTACTS.PHONE.

    *TODO: Any business rules for verifying data. Do we need it as a separate field*
  example: "0113 496 0000"

LiaisonManagerActiveDateFromV2:
  type: string
  format: date
  description: |
    CWA ref: PO_VENDOR_CONTACTS.CREATION_DATE

LiaisonManagerActiveDateToV2:
  type: string
  format: date
  description: |
    CWA ref: PO_VENDOR_CONTACTS.INACTIVE_DATE

OfficeLiaisonManagerCreateOrLinkV2:
  oneOf:
  - $ref: "#/LiaisonManagerCreateV2"
  - $ref: "#/LiaisonManagerLinkHeadOfficeV2"
  - $ref: "#/LiaisonManagerLinkChambersV2"
  - $ref: "#/LiaisonManagerLinkByGUIDV2"

LiaisonManagerCreateV2:
  type: object
  required:
  - firstName
  - lastName
  - emailAddress
  - telephoneNumber
  properties:
    firstName:
      $ref: "#/LiaisonManagerFirstNameV2"
    lastName:
      $ref: "#/LiaisonManagerLastNameV2"
    emailAddress:
      $ref: "#/LiaisonManagerEmailAddressV2"
    telephoneNumber:
      $ref: "#/LiaisonManagerPhoneV2"
    activeDateFrom:
      $ref: "#/LiaisonManagerActiveDateFromV2"
  description: |
    activeDateFrom by default is set to today's date. Previously 'active' liaison manager
    assignment activeDateTo's value should be set to activeDateFrom's date minus one day of the
    new assignment.

LiaisonManagerLinkHeadOfficeV2:
  type: object
  required:
  - useHeadOfficeLiaisonManager
  properties:
    useHeadOfficeLiaisonManager:
      type: boolean
      description: |
        Setting this flag to true interlinks liaison manager record from the head office
  description: |
    Applicable only for LSP offices. Indicates that new liaison manager assignment should be to
    the liaison manager that is currently specified at the head office. This update only links
    the data (no duplicate is created).

LiaisonManagerLinkChambersV2:
  type: object
  required:
  - useChambersLiaisonManager
  properties:
    useChambersLiaisonManager:
      type: boolean
      description: |
        Setting this flag to true interlinks liaison manager record from the Chambers
  description: |
    Applicable only for Advocate/Barrister. Indicates that new liaison manager assignment
    should be to the liaison manager that is currently specified at the Chambers' office. This
    update only links the data (no duplicate is created).

LiaisonManagerLinkedFlagV2:
  type: boolean
  description: |
    Indicates whether this liaison manager entry is specific to given provider or is linked.

    If the office is LSP and this flag is set to true it indicates that
    `useHeadOfficeLiaisonManager` option was used to create this entry.

    If the office is Advocate/Barrister and this flag is set to true it indicates that
    `useChambersLiaisonManager` option was used to create this entry.

    This flag is informational only; changes to the parent entity's liaison manager do not
    cascade to offices where this flag is set.

ProviderLiaisonManagerV2:
  allOf:
  - $ref: "./common.yaml#/BaseEntityV2"
  - type: object
    required:
    - firstName
    - lastName
    - emailAddress
    properties:
      firstName:
        $ref: "#/LiaisonManagerFirstNameV2"
      lastName:
        $ref: "#/LiaisonManagerLastNameV2"
      emailAddress:
        $ref: "#/LiaisonManagerEmailAddressV2"
      telephoneNumber:
        $ref: "#/LiaisonManagerPhoneV2"

ProviderLiaisonManagerPatchV2:
  type: object
  x-class-extra-annotation: >-
    @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
    {"guid", "firstName", "lastName", "activeDateFrom", "activeDateTo"})
  properties:
    emailAddress:
      $ref: "#/LiaisonManagerEmailAddressV2"
    telephoneNumber:
      $ref: "#/LiaisonManagerPhoneV2"
  description: |
    Permitted fields for amending a liaison manager. Only emailAddress and telephoneNumber
    may be amended. The fields guid, firstName, lastName, activeDateFrom and activeDateTo
    are read-only and will be rejected if provided.

LiaisonManagerV2:
  allOf:
  - $ref: "./common.yaml#/BaseEntityV2"
  - type: object
    required:
    - firstName
    - lastName
    - emailAddress
    - telephoneNumber
    - activeDateFrom
    - linkedFlag
    properties:
      firstName:
        $ref: "#/LiaisonManagerFirstNameV2"
      lastName:
        $ref: "#/LiaisonManagerLastNameV2"
      emailAddress:
        $ref: "#/LiaisonManagerEmailAddressV2"
      telephoneNumber:
        $ref: "#/LiaisonManagerPhoneV2"
      activeDateFrom:
        $ref: "#/LiaisonManagerActiveDateFromV2"
      activeDateTo:
        $ref: "#/LiaisonManagerActiveDateToV2"
      linkedFlag:
        $ref: "#/LiaisonManagerLinkedFlagV2"

LiaisonManagerLinkByGUIDV2:
  type: object
  required:
  - liaisonManagerGUID
  properties:
    liaisonManagerGUID:
      $ref: "./common.yaml#/BaseEntityGUIDV2"
  description: |
    Links an existing liaison manager to an office by GUID. Use this when the liaison manager
    already exists and you want to assign it to an office without creating a duplicate.
