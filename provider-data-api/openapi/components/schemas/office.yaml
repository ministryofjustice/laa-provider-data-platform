OfficeAddressPatchV2:
  description: |
    Address fields for a PATCH request. All fields are optional — absent or null means
    "leave unchanged". If a field is provided it must be non-blank (`minLength: 1`).
    Mandatory address fields (`line1`, `townOrCity`, `postcode`) cannot be blanked via
    a PATCH because null is treated as "leave unchanged" and empty strings are rejected.
  type: object
  properties:
    line1:
      type: string
      nullable: true
      minLength: 1
      example: "JUSTICE HOUSE"
    line2:
      type: string
      nullable: true
      minLength: 1
      example: "1 COURT LANE"
    line3:
      type: string
      nullable: true
      minLength: 1
    line4:
      type: string
      nullable: true
      minLength: 1
    townOrCity:
      type: string
      nullable: true
      minLength: 1
      example: "LEEDS"
    county:
      type: string
      nullable: true
      minLength: 1
    postcode:
      type: string
      nullable: true
      minLength: 1
      example: "LS1 1AA"

