PractitionerDetailsParentUpdateV2:
  oneOf:
  - type: object
    required:
    - parentGUID
    properties:
      parentGUID:
        $ref: "./common.yaml#/BaseEntityGUIDV2"
  - type: object
    required:
    - parentFirmNumber
    properties:
      parentFirmNumber:
        $ref: "./provider-firm.yaml#/ProviderFirmNumberV2"

PractitionerDetailsParentV2:
  type: object
  required:
  - parentGUID
  - parentFirmNumber
  - parentFirmType
  properties:
    parentGUID:
      $ref: "./common.yaml#/BaseEntityGUIDV2"
    parentFirmNumber:
      $ref: "./provider-firm.yaml#/ProviderFirmNumberV2"
    parentFirmType:
      $ref: "./provider-firm.yaml#/ProviderFirmTypeV2"

PractitionerDetailsAdvocateTypeV2:
  type: string
  enum:
  - Advocate
  - Barrister
  description: |
    Advocate sub-type can be Advocate or Barrister.

    Derived from advocateSolicitor flag in CWA.
    If advocateSolicitor=Y -> Advocate,
    if advocateSolicitor=N -> Barrister

    CWA ref: PO_VENDORS.ATTRIBUTE9.

    *TODO: Need better description of this field, any business rules*

PractitionerDetailsAdvocateLevelV2:
  type: string
  enum:
  - Junior
  - KC
  description: |
    Advocate level.

    WARNING: Same field as Barrister level in CWA

    CWA ref: PO_VENDORS.ATTRIBUTE10.

    *TODO: Need better description of this field, any business rules*

PractitionerDetailsBarristerLevelV2:
  type: string
  enum:
  - Junior
  - KC
  description: |
    Barrister level.

    WARNING: Same field as Advocate level in CWA

    CWA ref: PO_VENDORS.ATTRIBUTE10.

    *TODO: Need better description of this field, any business rules*

PractitionerDetailsSolicitorRegulationAuthorityRollNumberV2:
  type: string
  description: |
    Solicitors Regulation Authority roll number.

    CWA ref: PO_VENDORS.ATTRIBUTE11 (WARNING: same field is used by LSPs for Companies House
    number and by Barristers for Bar Council roll number).

    *TODO: Need better description of this field, any business rules*
  example: "*TODO: Provide example*"

PractitionerDetailsBarCouncilRollNumberV2:
  type: string
  description: |
    Bar Council roll number.

    CWA ref: PO_VENDORS.ATTRIBUTE11 (WARNING: same field is used by LSPs for Companies House
    number and by Advocates for SRA roll number).

    *TODO: Need better description of this field, any business rules*
  example: "*TODO: Provide example*"

PractitionerDetailsAdvocateDetailsV2:
  type: object
  required:
  - advocateLevel
  - solicitorRegulationAuthorityRollNumber
  properties:
    advocateLevel:
      $ref: "#/PractitionerDetailsAdvocateLevelV2"
    solicitorRegulationAuthorityRollNumber:
      $ref: "#/PractitionerDetailsSolicitorRegulationAuthorityRollNumberV2"

PractitionerDetailsBarristerDetailsV2:
  type: object
  required:
  - barristerLevel
  - barCouncilRollNumber
  properties:
    barristerLevel:
      $ref: "#/PractitionerDetailsBarristerLevelV2"
    barCouncilRollNumber:
      $ref: "#/PractitionerDetailsBarCouncilRollNumberV2"

PractitionerDetailsCreateV2:
  allOf:
  - $ref: "#/PractitionerDetailsCreateBaseV2"
  - oneOf:
    - $ref: "#/PractitionerDetailsCreateAdvocateV2"
    - $ref: "#/PractitionerDetailsCreateBarristerV2"

PractitionerDetailsCreateBaseV2:
  type: object
  required:
  - parentFirms
  - advocateType
  properties:
    parentFirms:
      type: array
      items:
        $ref: "#/PractitionerDetailsParentUpdateV2"
    advocateType:
      $ref: "#/PractitionerDetailsAdvocateTypeV2"

PractitionerDetailsCreateAdvocateV2:
  type: object
  required:
  - advocate
  properties:
    advocate:
      $ref: "#/PractitionerDetailsAdvocateDetailsV2"
  description: |
    Applicable only for `advocateType=Advocate`

PractitionerDetailsCreateBarristerV2:
  type: object
  required:
  - barrister
  properties:
    barrister:
      $ref: "#/PractitionerDetailsBarristerDetailsV2"
  description: |
    Applicable only for `advocateType=Barrister`

PractitionerDetailsV2:
  allOf:
  - $ref: "#/PractitionerDetailsBaseV2"
  - oneOf:
    - $ref: "#/PractitionerDetailsAdvocateV2"
    - $ref: "#/PractitionerDetailsBarristerV2"

PractitionerDetailsBaseV2:
  type: object
  required:
  - parentFirms
  - advocateType
  - office
  properties:
    parentFirms:
      type: array
      items:
        $ref: "#/PractitionerDetailsParentV2"
    advocateType:
      $ref: "#/PractitionerDetailsAdvocateTypeV2"
    office:
      $ref: "#/PractitionerOfficeCoreDetailsV2"

PractitionerDetailsAdvocateV2:
  type: object
  required:
  - advocate
  properties:
    advocate:
      $ref: "#/PractitionerDetailsAdvocateDetailsV2"

PractitionerDetailsBarristerV2:
  type: object
  required:
  - barrister
  properties:
    barrister:
      $ref: "#/PractitionerDetailsBarristerDetailsV2"

PractitionerDetailsPatchV2:
  x-class-extra-annotation: >-
    @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
    {"advocateType", "name", "accountNumber", "address", "telephoneNumber", "emailAddress",
    "website", "dxDetails"})
  allOf:
  - $ref: "#/PractitionerDetailsPatchBaseV2"
  - type: object
    properties:
      liaisonManager:
        $ref: "#/AdvocateOfficeLiaisonManagerCreateOrLinkV2"
  - oneOf:
    - $ref: "#/PractitionerDetailsPatchAdvocateDetailsV2"
    - $ref: "#/PractitionerDetailsPatchBarristerDetailsV2"

PractitionerDetailsPatchBaseV2:
  type: object
  properties:
    parentFirms:
      type: array
      items:
        $ref: "#/PractitionerDetailsParentUpdateV2"

PractitionerDetailsPatchAdvocateDetailsV2:
  type: object
  properties:
    advocateLevel:
      $ref: "#/PractitionerDetailsAdvocateLevelV2"
    solicitorRegulationAuthorityRollNumber:
      $ref: "#/PractitionerDetailsSolicitorRegulationAuthorityRollNumberV2"

PractitionerDetailsPatchBarristerDetailsV2:
  type: object
  properties:
    barristerLevel:
      $ref: "#/PractitionerDetailsBarristerLevelV2"
    barCouncilRollNumber:
      $ref: "#/PractitionerDetailsBarCouncilRollNumberV2"

PractitionerHeadOfficeCreateV2:
  type: object
  required:
  - payment
  - liaisonManager
  properties:
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationCreateV2"
    payment:
      $ref: "./bank-account.yaml#/PaymentDetailsCreateV2"
    liaisonManager:
      $ref: "#/AdvocateOfficeLiaisonManagerCreateOrLinkV2"

ProviderCreatePractitionerV2:
  type: object
  required:
  - practitioner
  properties:
    practitioner:
      x-class-extra-annotation: >-
        @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
        {"address", "telephoneNumber", "emailAddress", "website", "dxDetails"})
      allOf:
      - $ref: "#/PractitionerDetailsCreateV2"
      - $ref: "#/PractitionerHeadOfficeCreateV2"
  description: |
    Create provider of `firmType=Advocate`. Office is linked to the parent Chambers' office.

ProviderPractitionerV2:
  type: object
  required:
  - practitioner
  properties:
    practitioner:
      $ref: "#/PractitionerDetailsV2"
  description: |
    Provider of `firmType=Advocate`

ProviderPatchPractitionerV2:
  type: object
  properties:
    practitioner:
      $ref: "#/PractitionerDetailsPatchV2"
  description: |
    Update provider of `firmType=Advocate`

PractitionerOfficeCoreDetailsV2:
  type: object
  required:
  - officeGUID
  - accountNumber
  properties:
    officeGUID:
      $ref: "./common.yaml#/BaseEntityGUIDV2"
    accountNumber:
      $ref: "./office.yaml#/OfficeAccountNumberV2"
    activeDateTo:
      $ref: "./office.yaml#/OfficeActiveDateToV2"

OfficePractitionerV2:
  allOf:
  - $ref: "./common.yaml#/BaseEntityV2"
  - $ref: "./provider-firm.yaml#/ProviderBaseV2"
  - $ref: "#/ProviderPractitionerV2"

AdvocateOfficeDetailsV2:
  type: object
  required:
  - firmType
  - accountNumber
  - debtRecoveryFlag
  - falseBalanceFlag
  - intervened
  - address
  - payment
  properties:
    firmType:
      $ref: "./provider-firm.yaml#/ProviderFirmTypeV2"
    accountNumber:
      $ref: "./office.yaml#/OfficeAccountNumberV2"
    activeDateTo:
      $ref: "./office.yaml#/OfficeActiveDateToV2"
    debtRecoveryFlag:
      $ref: "./office.yaml#/DebtRecoveryFlagV2"
    falseBalanceFlag:
      $ref: "./office.yaml#/FalseBalanceFlagV2"
    intervened:
      $ref: "./office.yaml#/IntervenedOfficeDetailsV2"
    address:
      $ref: "./office.yaml#/OfficeAddressV2"
    telephoneNumber:
      $ref: "./office.yaml#/OfficePhoneV2"
    emailAddress:
      $ref: "./office.yaml#/OfficeEmailAddressV2"
    website:
      $ref: "./office.yaml#/OfficeWebsiteV2"
    dxDetails:
      $ref: "./office.yaml#/DXV2"
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationV2"
    payment:
      $ref: "./bank-account.yaml#/PaymentDetailsV2"

AdvocateOfficePatchV2:
  type: object
  x-class-extra-annotation: >-
    @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
    {"officeGUID", "providerFirmGUID", "accountNumber"})
  properties:
    activeDateTo:
      $ref: "./office.yaml#/OfficeActiveDateToV2"
    clearActiveDateTo:
      $ref: "./office.yaml#/ClearActiveDateToV2"
    debtRecoveryFlag:
      $ref: "./office.yaml#/DebtRecoveryFlagV2"
    falseBalanceFlag:
      $ref: "./office.yaml#/FalseBalanceFlagV2"
    intervened:
      $ref: "./office.yaml#/IntervenedOfficeDetailsPatchV2"
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationV2"
    payment:
      $ref: "./bank-account.yaml#/PaymentDetailsPatchOrLinkV2"

AdvocateOfficeLiaisonManagerCreateOrLinkV2:
  oneOf:
  - $ref: "./liaison-manager.yaml#/LiaisonManagerCreateV2"
  - $ref: "./liaison-manager.yaml#/LiaisonManagerLinkChambersV2"
  - $ref: "./liaison-manager.yaml#/LiaisonManagerLinkByGUIDV2"
