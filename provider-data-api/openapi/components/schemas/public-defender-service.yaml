PDSConstitutionalStatusV2:
  type: string
  enum:
  - Government Funded Organisation
  description: Constitutional status for a Public Defender Service provider.

PDSHeadOfficeCreateV2:
  type: object
  required:
  - address
  properties:
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationCreateV2"
    address:
      $ref: "./office.yaml#/OfficeAddressV2"
    telephoneNumber:
      $ref: "./office.yaml#/OfficePhoneV2"
    emailAddress:
      $ref: "./office.yaml#/OfficeEmailAddressV2"
    website:
      $ref: "./office.yaml#/OfficeWebsiteV2"
    dxDetails:
      $ref: "./office.yaml#/DXCreateV2"
  description: |
    PDS head office details. Address line 1, city and postcode are required by `OfficeAddressV2`.
    DX Number and DX Centre must either both be supplied or both be absent. No payment, bank
    account, liaison manager or contract manager is required.

PublicDefenderServiceCreateV2:
  type: object
  required:
  - name
  - constitutionalStatus
  - headOffice
  properties:
    name:
      $ref: "./provider-firm.yaml#/ProviderFirmNameV2"
    constitutionalStatus:
      $ref: "#/PDSConstitutionalStatusV2"
    indemnityReceivedDate:
      $ref: "./legal-services-provider.yaml#/LSPDetailsIndemnityReceivedDateV2"
    companiesHouseNumber:
      $ref: "./legal-services-provider.yaml#/LSPDetailsCompaniesHouseNumberV2"
    headOffice:
      $ref: "#/PDSHeadOfficeCreateV2"
  description: |
    Complete request to create a Public Defender Service provider and its head office. The firm
    type is fixed by the PDS-specific endpoint and is not supplied by the caller. The current PDS
    scope supports a head office only; whether child offices may be added is an open business
    question for a future change. The nested head office is therefore implicitly the provider's
    head office.

PDSDetailsV2:
  type: object
  required:
  - constitutionalStatus
  - headOffice
  properties:
    constitutionalStatus:
      $ref: "#/PDSConstitutionalStatusV2"
    indemnityReceivedDate:
      $ref: "./legal-services-provider.yaml#/LSPDetailsIndemnityReceivedDateV2"
    companiesHouseNumber:
      $ref: "./legal-services-provider.yaml#/LSPDetailsCompaniesHouseNumberV2"
    headOffice:
      $ref: "#/PDSHeadOfficeDetailsV2"

ProviderPatchPDSV2:
  type: object
  properties:
    publicDefenderService:
      $ref: "#/PDSDetailsPatchV2"
  description: |
    Update permitted details of a Public Defender Service provider. Firm type and server-owned
    identifiers are not amendable through the common provider PATCH operation.

PDSDetailsPatchV2:
  type: object
  x-class-extra-annotation: >-
    @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
    {"firmType", "accountNumber", "providerFirmGUID", "providerFirmNumber", "headOfficeFlag"})
  properties:
    constitutionalStatus:
      $ref: "#/PDSConstitutionalStatusV2"
    indemnityReceivedDate:
      $ref: "./legal-services-provider.yaml#/LSPDetailsIndemnityReceivedDateV2"
    companiesHouseNumber:
      $ref: "./legal-services-provider.yaml#/LSPDetailsCompaniesHouseNumberV2"
    firmIntervenedFlag:
      $ref: "./provider-firm.yaml#/FirmIntervenedFlagV2"
    firmIntervenedDate:
      $ref: "./provider-firm.yaml#/FirmIntervenedDateV2"
    holdAllPaymentsFlag:
      $ref: "./provider-firm.yaml#/HoldAllPaymentsFlagV2"
    holdAllPaymentsReason:
      $ref: "./provider-firm.yaml#/HoldAllPaymentsReasonV2"
    referredToDebtRecoveryFlag:
      $ref: "./provider-firm.yaml#/ReferredToDebtRecoveryFlagV2"
    headOffice:
      $ref: "#/PDSHeadOfficeDetailsPatchV2"

PDSHeadOfficeDetailsPatchV2:
  type: object
  x-class-extra-annotation: >-
    @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
    {"officeGUID", "providerFirmGUID", "accountNumber", "headOfficeFlag"})
  properties:
    activeDateTo:
      $ref: "./office.yaml#/OfficeActiveDateToV2"
    clearActiveDateTo:
      $ref: "./office.yaml#/ClearActiveDateToV2"
    falseBalanceFlag:
      $ref: "./office.yaml#/FalseBalanceFlagV2"
    address:
      $ref: "./office.yaml#/OfficeAddressPatchV2"
    telephoneNumber:
      $ref: "./office.yaml#/OfficePhoneV2"
    emailAddress:
      $ref: "./office.yaml#/OfficeEmailAddressV2"
    website:
      $ref: "./office.yaml#/OfficeWebsiteV2"
    dxDetails:
      $ref: "./office.yaml#/DXPatchV2"
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationV2"

PDSOfficePatchV2:
  type: object
  x-class-extra-annotation: >-
    @uk.gov.justice.laa.providerdata.annotation.RejectProperties(
    {"officeGUID", "providerFirmGUID", "accountNumber", "headOfficeFlag"})
  properties:
    activeDateTo:
      $ref: "./office.yaml#/OfficeActiveDateToV2"
    clearActiveDateTo:
      $ref: "./office.yaml#/ClearActiveDateToV2"
    debtRecoveryFlag:
      $ref: "./office.yaml#/DebtRecoveryFlagV2"
    falseBalanceFlag:
      $ref: "./office.yaml#/FalseBalanceFlagV2"
    intervened:
      $ref: "./office.yaml#/IntervenedOfficeDetailsPatchV2"
    address:
      $ref: "./office.yaml#/OfficeAddressPatchV2"
    telephoneNumber:
      $ref: "./office.yaml#/OfficePhoneV2"
    emailAddress:
      $ref: "./office.yaml#/OfficeEmailAddressV2"
    website:
      $ref: "./office.yaml#/OfficeWebsiteV2"
    dxDetails:
      $ref: "./office.yaml#/DXPatchV2"
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationV2"

PDSHeadOfficeDetailsV2:
  allOf:
  - $ref: "#/PDSOfficeDetailsV2"
  - type: object
    required:
    - officeGUID
    properties:
      officeGUID:
        $ref: "./common.yaml#/BaseEntityGUIDV2"

PDSOfficeDetailsV2:
  type: object
  required:
  - firmType
  - accountNumber
  - address
  properties:
    firmType:
      $ref: "./provider-firm.yaml#/ProviderFirmTypeV2"
    accountNumber:
      $ref: "./office.yaml#/OfficeAccountNumberV2"
    activeDateTo:
      $ref: "./office.yaml#/OfficeActiveDateToV2"
    debtRecoveryFlag:
      $ref: "./office.yaml#/DebtRecoveryFlagV2"
    falseBalanceFlag:
      $ref: "./office.yaml#/FalseBalanceFlagV2"
    intervened:
      $ref: "./office.yaml#/IntervenedOfficeDetailsV2"
    address:
      $ref: "./office.yaml#/OfficeAddressV2"
    telephoneNumber:
      $ref: "./office.yaml#/OfficePhoneV2"
    emailAddress:
      $ref: "./office.yaml#/OfficeEmailAddressV2"
    website:
      $ref: "./office.yaml#/OfficeWebsiteV2"
    dxDetails:
      $ref: "./office.yaml#/DXV2"
    vatRegistration:
      $ref: "./office.yaml#/VATRegistrationV2"

ProviderPDSV2:
  type: object
  required:
  - publicDefenderService
  properties:
    publicDefenderService:
      $ref: "#/PDSDetailsV2"
