  /provider-firms:
    $ref: ./paths/provider-firm.yaml#/~1provider-firms
  /provider-firms/{providerFirmGUIDorFirmNumber}:
    $ref: ./paths/provider-firm.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}
  /provider-firms/{providerFirmGUIDorFirmNumber}/bank-details:
    $ref: ./paths/bank-account.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1bank-details
  /provider-firms/{providerFirmGUIDorFirmNumber}/offices/{officeGUIDorCode}/bank-details:
    $ref: ./paths/bank-account.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1offices~1{officeGUIDorCode}~1bank-details
  /provider-firms/{providerFirmGUIDorFirmNumber}/offices:
    $ref: ./paths/office.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1offices
  /provider-firms-offices:
    $ref: ./paths/office.yaml#/~1provider-firms-offices
  /provider-firms/{providerFirmGUIDorFirmNumber}/offices/{officeGUIDorCode}:
    $ref: ./paths/office.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1offices~1{officeGUIDorCode}
  /provider-firms/{providerFirmGUIDorFirmNumber}/offices/{officeGUIDorCode}/liaison-managers:
    $ref: ./paths/liaison-manager.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1offices~1{officeGUIDorCode}~1liaison-managers
  /provider-firms/{providerFirmGUIDorFirmNumber}/offices/{officeGUIDorCode}/contract-managers:
    $ref: ./paths/contract-manager.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1offices~1{officeGUIDorCode}~1contract-managers
  /provider-firms/{providerFirmGUIDorFirmNumber}/practitioners:
    $ref: ./paths/provider-firm.yaml#/~1provider-firms~1{providerFirmGUIDorFirmNumber}~1practitioners
