        type: string
      description: |
        Partial text search by bank account number
    - $ref: "../components/parameters/common.yaml#/QPageNumber"
    - $ref: "../components/parameters/common.yaml#/QPageSize"

    responses:
      "200":
        description: List of bank accounts matching the filters
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: "../components/schemas/bank-account.yaml#/OfficeBankAccountV2"
                    metadata:
