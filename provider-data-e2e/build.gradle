plugins {
    id 'java'
    id 'checkstyle'
    id 'com.diffplug.spotless'
    id 'io.github.ben-manes.versions'
}

repositories {
    mavenCentral()
}

// No production code; JaCoCo coverage is not meaningful for E2E projects.
tasks.withType(org.gradle.testing.jacoco.tasks.JacocoReport).configureEach { enabled = false }
tasks.withType(org.gradle.testing.jacoco.tasks.JacocoCoverageVerification).configureEach { enabled = false }

dependencies {
    // JUnit: use BOM to constrain versions for both compile & runtime tests
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Rest Assured
    testImplementation platform('io.rest-assured:rest-assured-bom:6.0.1')
    testImplementation 'io.rest-assured:rest-assured'
    // OpenAPI response validation against laa-data-pda.yml
    testImplementation project(':provider-data-api')
    testImplementation 'com.atlassian.oai:openapi-request-validator-restassured:3.0.0'
}

test {
    useJUnitPlatform()
}

tasks.named("test") { enabled = false }

// Resolves the effective test-data properties using the same layering as E2eConfig
// (default.properties -> E2E_PROPERTIES if set, else local.properties), so gating decisions
// come from properties content rather than an e2e.env/profile name (DSTEW-2054 AC3).
def loadEffectiveTestProperties = {
    def props = new Properties()
    def resourcesDir = file('src/test/resources')
    def defaultFile = new File(resourcesDir, 'default.properties')
    if (defaultFile.exists()) {
        defaultFile.withInputStream { props.load(it) }
    }
    def overrideProps = System.getenv('E2E_PROPERTIES')
    // Explicit non-null/non-blank check (not Groovy's string truthiness) so this matches
    // E2eConfig.loadEnvSpecificProperties exactly and stays correct if ever ported to Kotlin DSL.
    if (overrideProps != null && !overrideProps.trim().isEmpty()) {
        props.load(new StringReader(overrideProps))
    } else {
        def localFile = new File(resourcesDir, 'local.properties')
        if (localFile.exists()) {
            localFile.withInputStream { props.load(it) }
        }
    }
    return props
}

def isModifyingAllowed = {
    Boolean.parseBoolean(loadEffectiveTestProperties().getProperty('e2e.modifyingAllowed', 'false'))
}

def isDataPopulated = {
    Boolean.parseBoolean(loadEffectiveTestProperties().getProperty('e2e.dataPopulated', 'false'))
}

def configureE2E = { Test t ->
    t.testClassesDirs = sourceSets.test.output.classesDirs
    t.classpath       = sourceSets.test.runtimeClasspath
    t.testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
        showStandardStreams = true
    }

    t.doFirst {
        def baseUri = System.getProperty('e2e.baseUri') ?: System.getenv('E2E_BASEURI')
        if (baseUri) {
            t.systemProperty 'e2e.baseUri', baseUri
            println "e2e override: e2e.baseUri=${baseUri}"
        }

        def authToken = System.getProperty('e2e.authToken') ?: System.getenv('E2E_AUTHTOKEN')
        if (authToken) {
            t.systemProperty 'e2e.authToken', authToken
        }

        def authHeader = System.getProperty('e2e.authHeader') ?: System.getenv('E2E_AUTHHEADER')
        if (authHeader) {
            t.systemProperty 'e2e.authHeader', authHeader
        }
    }
}

tasks.register("e2eReadOnly", Test) {
    description = "Run read-only E2E tests (@ReadOnlyTest). Safe to run against any environment including production."
    group = "verification"
    // TODO: Remove this guard once the PDA-r2 database has been deployed to non-local environments.
    // Read-only tests require known data. The shared RDS instances (uat, staging, prod) do not
    // yet have populated data, so this stays restricted until their properties set
    // e2e.dataPopulated=true.
    onlyIf("Read-only E2E tests are temporarily restricted until this environment's properties " +
            "set e2e.dataPopulated=true") {
        isDataPopulated()
    }
    configureE2E(delegate)
    useJUnitPlatform { includeTags "read-only" }
    outputs.upToDateWhen { false }
}

tasks.register("e2eModifying", Test) {
    description = "Run data-modifying E2E tests (@ModifyingTest). Must not run against production."
    group = "verification"
    configureE2E(delegate)
    useJUnitPlatform { includeTags "modifying" }
    mustRunAfter tasks.named("e2eReadOnly")
    outputs.upToDateWhen { false }

    doFirst {
        if (!isModifyingAllowed()) {
            throw new GradleException(
                "Data-modifying E2E tests are not allowed here (e2e.modifyingAllowed is not " +
                "'true' for this environment's properties). Use 'e2eReadOnly' instead, or target " +
                "an environment whose properties opt in."
            )
        }
    }
}

tasks.register("e2eTest") {
    description = "Run read-only E2E tests in all environments. Also runs data-modifying E2E tests " +
            "when the target environment's properties set e2e.modifyingAllowed=true."
    group = "verification"
    dependsOn "e2eReadOnly"
    if (isModifyingAllowed()) {
        dependsOn "e2eModifying"
    }
    outputs.upToDateWhen { false }
}
