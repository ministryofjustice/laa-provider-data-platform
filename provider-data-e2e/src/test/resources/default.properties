# Fallback values shared by all E2E environments.
# The E2E_PROPERTIES secret (or local.properties, if E2E_PROPERTIES is unset) overrides these
# values when present.

e2e.baseUri=http://localhost:8080

# Data-modifying tests (@ModifyingTest) must not run unless a properties source explicitly opts
# in. Only local.properties, and any E2E_PROPERTIES secret content that opts in, set this true.
e2e.modifyingAllowed=false

# Read-only tests (@ReadOnlyTest) require known seeded data. Shared environments (uat, staging,
# prod) don't yet have it, so this stays false until their E2E_PROPERTIES secret sets it true.
e2e.dataPopulated=false

# ---- Invalid identifiers (for 404 testing) ----
invalid.firmNumber=UNKNOWN-FIRM
invalid.officeCode=ZZZZZZZ
